<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Jade's Writing Workspace</title>
  
  <!-- Beautiful Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,700;1,400&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  
  <style>
    /* ======= Base Styles ======= */
    * {
      box-sizing: border-box;
    }

    body {
      /* Applying the elegant writing font to the whole body */
      font-family: 'Lora', serif;
      background: url('https://images7.alphacoders.com/135/1350454.png') no-repeat center center fixed;
      background-size: cover;
      color: #ddd;
      max-width: 800px;
      margin: 40px auto;
      padding: 30px 40px;
      box-shadow: 0 0 30px rgba(30, 30, 47, 0.85);
      border-radius: 12px;
      position: relative;
      overflow-x: hidden;
      background-color: #0c0d14; /* Fallback */
    }

    /* Rain canvas styles */
    #rain-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    /* Ensure content stays above rain */
    body > *:not(#rain-canvas) {
      position: relative;
      z-index: 1;
    }

    /* Headers - Beautiful Serif Display Font */
    h1, h2 {
      font-family: 'Playfair Display', serif;
      font-weight: 700;
      letter-spacing: 2px;
      color: #f0f0f5;
      text-shadow: 0 0 8px rgba(123, 123, 157, 0.8);
    }

    h1 {
      font-size: 2.8rem;
      margin-bottom: 5px;
    }

    .subtitle {
      font-family: 'Playfair Display', serif;
      font-size: 1.2rem;
      font-style: italic;
      color: #a5d6ff;
      margin-bottom: 25px;
      letter-spacing: 1px;
    }

    /* Form & Writing Box Controls */
    .editor-container {
      display: flex;
      flex-direction: column;
      gap: 20px;
      margin-top: 20px;
    }

    .meta-inputs {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex: 1;
      min-width: 140px;
    }

    .input-group.small {
      max-width: 150px;
    }

    label {
      font-family: 'Playfair Display', serif;
      font-size: 0.95rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #8ab4f8;
      font-weight: 700;
    }

    /* Transparent Inputs & Textarea */
    input[type="text"],
    input[type="number"],
    textarea {
      width: 100%;
      background: transparent; /* Fully transparent */
      border: 1px solid rgba(138, 180, 248, 0.4);
      border-radius: 8px;
      padding: 15px 18px;
      color: #f0f0f5;
      font-family: 'Lora', serif; /* Beautiful readable font */
      font-size: 1.15rem;
      outline: none;
      /* Adds a slight glass blur so text stays readable over the background */
      backdrop-filter: blur(4px); 
      -webkit-backdrop-filter: blur(4px);
      transition: border-color 0.4s ease, box-shadow 0.4s ease, background 0.4s ease;
    }

    input[type="text"]:focus,
    input[type="number"]:focus,
    textarea:focus {
      border-color: #8ab4f8;
      box-shadow: 0 0 15px rgba(138, 180, 248, 0.4);
      background: rgba(255, 255, 255, 0.03); /* Just a tiny hint of light when typing */
    }

    /* Adjust placeholder color to fit the transparent theme */
    ::placeholder {
      color: rgba(240, 240, 245, 0.4);
    }

    textarea {
      min-height: 450px;
      line-height: 1.8;
      resize: vertical;
      white-space: pre-wrap;
    }

    .stats-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 1rem;
      color: #b0aaff;
      margin-top: -5px;
      font-style: italic;
    }

    /* Buttons */
    .actions {
      display: flex;
      gap: 15px;
      margin-top: 10px;
      flex-wrap: wrap;
    }

    button.action-btn {
      font-family: 'Playfair Display', serif;
      background: rgba(97, 90, 196, 0.8);
      color: white;
      border: 1px solid #8777e8;
      padding: 12px 24px;
      font-size: 1.1rem;
      font-weight: 700;
      border-radius: 40px;
      cursor: pointer;
      backdrop-filter: blur(5px);
      box-shadow: 0 5px 15px rgba(97, 90, 196, 0.4);
      transition: all 0.3s ease;
      letter-spacing: 1px;
    }

    button.action-btn:hover {
      background: rgba(135, 119, 232, 0.9);
      transform: scale(1.03);
      box-shadow: 0 8px 20px rgba(135, 119, 232, 0.7);
    }

    button.action-btn:active {
      transform: scale(0.97);
    }

    /* Neon button link */
    .neon-button {
      font-family: 'Playfair Display', serif;
      display: inline-block;
      padding: 12px 24px;
      border-radius: 30px;
      background: rgba(97, 90, 196, 0.8);
      border: 1px solid #8777e8;
      color: #fff;
      font-size: 1.1rem;
      font-weight: 700;
      text-decoration: none;
      backdrop-filter: blur(5px);
      box-shadow: 0 0 10px rgba(135, 119, 232, 0.5);
      transition: all 0.3s ease;
    }

    .neon-button:hover {
      box-shadow: 0 0 20px #b0aaff, 0 0 30px rgba(176, 170, 255, 0.5);
      background: rgba(135, 119, 232, 0.9);
      color: #fff;
      transform: scale(1.03);
    }

    /* Links & Footer */
    a {
      color: #8ab4f8;
      text-decoration: none;
      font-weight: 600;
      transition: color 0.3s ease;
    }

    a:hover {
      color: #fff;
      text-shadow: 0 0 10px #8ab4f8;
    }

    footer {
      margin-top: 40px;
      font-size: 0.95rem;
      text-align: center;
      color: #999;
      letter-spacing: 0.1em;
      border-top: 1px solid rgba(138, 180, 248, 0.2);
      padding-top: 20px;
    }

    /* ======= Print & PDF Export Styles ======= */
    @media print {
      body {
        background: url('https://images7.alphacoders.com/135/1350454.png') no-repeat center center !important;
        background-size: cover !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
        color: #ffffff !important;
        box-shadow: none !important;
        margin: 0 !important;
        padding: 20px !important;
        max-width: 100% !important;
      }

      #rain-canvas,
      .actions,
      footer,
      .stats-bar {
        display: none !important;
      }

      input[type="text"],
      input[type="number"],
      textarea {
        background: transparent !important;
        color: #ffffff !important;
        border: 1px solid rgba(138, 180, 248, 0.6) !important;
        box-shadow: none !important;
      }

      textarea {
        height: auto !important;
        min-height: 600px !important;
      }
    }
  </style>
</head>

<body>
  <!-- Rain Canvas -->
  <canvas id="rain-canvas"></canvas>

  <header>
    <h1>Jade's Writer Desk</h1>
    <p class="subtitle">Draft your next chapter in style ✍️🚀</p>
  </header>

  <main class="editor-container">
    <div class="meta-inputs">
      <div class="input-group small">
        <label for="chapter-num">Chapter No.</label>
        <input type="number" id="chapter-num" value="1" min="1" />
      </div>
      <div class="input-group">
        <label for="chapter-title">Chapter Title</label>
        <input type="text" id="chapter-title" placeholder="e.g. Into the Backrooms..." />
      </div>
    </div>

    <div class="input-group">
      <label for="content-box">Chapter Content</label>
      <textarea id="content-box" placeholder="The rain battered against the window as the first words were written..."></textarea>
    </div>

    <div class="stats-bar">
      <span id="word-count">Words: 0</span>
      <span id="char-count">Characters: 0</span>
    </div>

    <div class="actions">
      <button class="action-btn" id="pdf-btn">Export PDF (Scannable)</button>
      <a href="https://www.webnovel.com/book/backrooms-no-exit_29143630108328705" target="_blank" class="neon-button">Read my Webnovel →</a>
    </div>
  </main>

  <footer>
    <p>
      Find me on 
      <a href="https://github.com/pmjade/pmjade" target="_blank" rel="noopener noreferrer">GitHub</a> | 
      <a href="https://www.linkedin.com/in/aki-shinichi-715594354" target="_blank" rel="noopener noreferrer">LinkedIn</a>
    </p>
  </footer>

  <script>
    // ======= Rain Canvas Animation =======
    const canvas = document.getElementById("rain-canvas");
    const ctx = canvas.getContext("2d");

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resizeCanvas();

    window.addEventListener("resize", resizeCanvas);

    const drops = [];
    const numDrops = 300;

    for (let i = 0; i < numDrops; i++) {
      drops.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        length: Math.random() * 20 + 10,
        speed: Math.random() * 5 + 5,
      });
    }

    function drawRain() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.strokeStyle = "rgba(174,194,224,0.4)";
      ctx.lineWidth = 1;
      ctx.lineCap = "round";

      for (let i = 0; i < drops.length; i++) {
        const d = drops[i];
        ctx.beginPath();
        ctx.moveTo(d.x, d.y);
        ctx.lineTo(d.x, d.y + d.length);
        ctx.stroke();
        d.y += d.speed;
        if (d.y > canvas.height) {
          d.y = -20;
          d.x = Math.random() * canvas.width;
        }
      }
      requestAnimationFrame(drawRain);
    }
    drawRain();

    // ======= Word & Character Counter =======
    const textarea = document.getElementById('content-box');
    const wordCountDisplay = document.getElementById('word-count');
    const charCountDisplay = document.getElementById('char-count');

    textarea.addEventListener('input', () => {
      const text = textarea.value.trim();
      const words = text ? text.split(/\s+/).length : 0;
      const chars = text.length;

      wordCountDisplay.textContent = `Words: ${words}`;
      charCountDisplay.textContent = `Characters: ${chars}`;
    });

    // ======= Scannable PDF Export =======
    document.getElementById('pdf-btn').addEventListener('click', () => {
      window.print();
    });
  </script>
</body>
</html>
